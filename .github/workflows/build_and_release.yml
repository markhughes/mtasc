name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            shell-name: bash
            ocaml-version: "4.12"
          - os: macos-latest
            shell-name: bash
            ocaml-version: "4.12"
          - os: windows-latest
            shell-name: cygwin
            ocaml-version: "4.12"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-version }}

      - name: Build (Linux/Mac)
        if: matrix.shell-name == 'bash'
        run: ./build.sh
        shell: bash

      - name: Build (Windows - Cygwin)
        if: matrix.shell-name == 'cygwin'
        env:
          # keep the login shell in the workspace instead of cd'ing to $HOME
          CHERE_INVOKING: "1"
        run: D:\cygwin\bin\bash.exe --login -c "./build.sh"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: mtasc-${{ matrix.os }}
          path: bin/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download builds
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Zip builds
        run: |
          cd dist
          for dir in mtasc-*/; do
            name="${dir%/}"
            (cd "$name" && zip -r "../${name}_${GITHUB_REF_NAME}.zip" .)
          done

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
